<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慈濟大學 經營管理學系 | Department of Business Management, Tzu Chi University</title>
    <!-- Google Fonts: 古典倫敦大學襯線體與現代無襯線體組合 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           1. 倫敦大學風格 全域 CSS 變數定義
           ========================================== */
        :root {
            --uol-navy: #002147;       /* 皇家深藍 Royal Oxford Navy */
            --uol-navy-light: #0d3663; /* 淺高雅藍 */
            --uol-gold: #c5a059;       /* 學術金 Academic Gold */
            --uol-gold-hover: #dfb76c; /* 明亮金 */
            --uol-crimson: #800020;    /* 倫敦帝國紅 Regal Crimson */
            --uol-dark: #111111;       /* 文字深灰 */
            --uol-grey-bg: #f4f5f7;    /* 淺灰底色 */
            --uol-warm-white: #faf9f5; /* 古典象牙白 */
            --uol-border: #dcd6cd;     /* 典雅細線 */
            --uol-shadow: 0 10px 30px rgba(0, 33, 71, 0.08);
            --font-serif: 'Playfair Display', 'Noto Serif TC', Georgia, serif;
            --font-sans: 'Roboto', 'Noto Sans TC', sans-serif;
            --font-display: 'Cinzel', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--uol-warm-white);
            color: var(--uol-dark);
            line-height: 1.7;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        ul {
            list-style: none;
        }

        /* ==========================================
           2. 倫敦大學風格 頁首標籤與導覽列 Header
           ========================================== */
        .uol-topbar {
            background-color: var(--uol-navy);
            color: #ffffff;
            font-size: 0.85rem;
            padding: 8px 0;
            border-bottom: 2px solid var(--uol-gold);
        }

        .uol-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .uol-topbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .uol-topbar-links a {
            color: rgba(255, 255, 255, 0.8);
            margin-left: 20px;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .uol-topbar-links a:hover {
            color: var(--uol-gold);
        }

        .uol-header {
            background: #ffffff;
            padding: 24px 0;
            border-bottom: 1px solid var(--uol-border);
            box-shadow: var(--uol-shadow);
        }

        .uol-header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .uol-brand {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .uol-crest {
            width: 65px;
            height: 65px;
            background: var(--uol-navy);
            color: var(--uol-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border: 2px solid var(--uol-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .uol-title-group h1 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--uol-navy);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .uol-title-group p {
            font-family: var(--font-display);
            font-size: 0.85rem;
            color: var(--uol-gold);
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .uol-search-box {
            position: relative;
            width: 260px;
        }

        .uol-search-box input {
            width: 100%;
            padding: 9px 40px 9px 15px;
            border: 1px solid var(--uol-border);
            border-radius: 30px;
            background-color: var(--uol-warm-white);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.3s;
        }

        .uol-search-box input:focus {
            border-color: var(--uol-navy);
            box-shadow: 0 0 0 3px rgba(0, 33, 71, 0.1);
        }

        .uol-search-box button {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--uol-navy);
            cursor: pointer;
        }

        /* 主導覽列 Navbar */
        .uol-nav {
            background-color: var(--uol-navy);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .uol-nav-list {
            display: flex;
            justify-content: flex-start;
        }

        .uol-nav-item {
            position: relative;
        }

        .uol-nav-link {
            display: block;
            padding: 16px 24px;
            color: #ffffff;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-bottom: 3px solid transparent;
        }

        .uol-nav-link:hover, .uol-nav-item.active .uol-nav-link {
            background-color: var(--uol-navy-light);
            color: var(--uol-gold);
            border-bottom-color: var(--uol-gold);
        }

        /* ==========================================
           3. 社論風格 Hero 焦點輪播區
           ========================================== */
        .uol-hero {
            position: relative;
            background: linear-gradient(135deg, var(--uol-navy) 0%, #001229 100%);
            color: #ffffff;
            padding: 80px 0 100px;
            overflow: hidden;
            border-bottom: 5px solid var(--uol-gold);
        }

        .uol-hero::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: radial-gradient(circle at 80% 20%, rgba(197, 160, 89, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .uol-hero-slider {
            position: relative;
            min-height: 380px;
        }

        .uol-slide {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .uol-slide.active {
            display: grid;
            opacity: 1;
        }

        .uol-slide-tag {
            display: inline-block;
            background-color: var(--uol-gold);
            color: var(--uol-navy);
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-radius: 2px;
        }

        .uol-slide-title {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            line-height: 1.25;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .uol-slide-desc {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .uol-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            background-color: var(--uol-gold);
            color: var(--uol-navy);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 2px;
        }

        .uol-btn:hover {
            background-color: #ffffff;
            color: var(--uol-navy);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        .uol-slide-img {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            border: 4px solid rgba(197, 160, 89, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            height: 340px;
        }

        .uol-slide-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .uol-slider-nav {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .uol-slider-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .uol-slider-dot.active {
            background-color: var(--uol-gold);
            width: 32px;
            border-radius: 6px;
        }

        /* ==========================================
           4. 學術統計與戰略核心區
           ========================================== */
        .uol-stats-bar {
            background-color: #ffffff;
            margin-top: -40px;
            position: relative;
            z-index: 10;
            border-radius: 4px;
            box-shadow: var(--uol-shadow);
            border-top: 4px solid var(--uol-navy);
        }

        .uol-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 30px 0;
            text-align: center;
        }

        .uol-stat-item {
            border-right: 1px solid var(--uol-border);
            padding: 0 20px;
        }

        .uol-stat-item:last-child {
            border-right: none;
        }

        .uol-stat-num {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            color: var(--uol-navy);
            font-weight: 700;
        }

        .uol-stat-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* ==========================================
           5. 主要內容板塊（區塊標題、公告Tabs與卡片）
           ========================================== */
        .uol-section {
            padding: 70px 0;
        }

        .uol-section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .uol-section-title h2 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            color: var(--uol-navy);
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
